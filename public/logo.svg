<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Curved paths for ribbon text -->
    <path id="textPathTop" d="M 105,312 Q 250,358 395,312" fill="none" />
    <path id="textPathBottom" d="M 135,334 Q 250,373 365,334" fill="none" />
    
    <!-- Clip path for circular emblem inner area -->
    <clipPath id="circleClip">
      <circle cx="250" cy="225" r="132" />
    </clipPath>
  </defs>

  <!-- Solid black background like photo -->
  <rect width="500" height="500" fill="#000000" rx="20" />

  <!-- Outer white glow/border contour behind ribbon & badge -->
  <!-- Ribbon Back White Underlay -->
  <path d="M 68,348 L 98,300 L 140,305 L 140,290 C 170,278 210,270 250,270 C 290,270 330,278 360,290 L 360,305 L 402,300 L 432,348 L 392,340 L 360,375 C 325,395 288,402 250,402 C 212,402 175,395 140,375 L 108,340 Z" fill="#ffffff" />

  <!-- Outer White Circle Badge -->
  <circle cx="250" cy="225" r="148" fill="#ffffff" />
  
  <!-- Outer Purple Badge Base -->
  <circle cx="250" cy="225" r="140" fill="#35105c" />
  
  <!-- Outer concentric thin white circle -->
  <circle cx="250" cy="225" r="135" fill="none" stroke="#ffffff" stroke-width="4" />
  
  <!-- Inner concentric white circle border -->
  <circle cx="250" cy="225" r="126" fill="none" stroke="#ffffff" stroke-width="3" />

  <!-- Inner Dome Area with building silhouette -->
  <g clip-path="url(#circleClip)">
    <!-- White sky background for upper half -->
    <path d="M 115,225 A 135,135 0 0,1 385,225 L 385,225 L 115,225 Z" fill="#ffffff" />
    
    <!-- Purple base for bottom half behind building -->
    <rect x="110" y="222" width="280" height="150" fill="#35105c" />
    
    <!-- Building Silhouette (Iconic Madrasah Mu'allimin Yogyakarta Clock Tower Building) -->
    <!-- Main Center Tower -->
    <!-- Stepped Roof / Cap -->
    <rect x="231" y="112" width="38" height="6" rx="1" fill="#35105c" />
    <rect x="235" y="118" width="30" height="5" fill="#35105c" />
    <!-- Tower Body -->
    <rect x="233" y="123" width="34" height="55" fill="#35105c" />
    <!-- Tower 4 Vertical White Windows -->
    <rect x="237" y="133" width="3" height="32" rx="1.5" fill="#ffffff" />
    <rect x="244" y="133" width="3" height="32" rx="1.5" fill="#ffffff" />
    <rect x="253" y="133" width="3" height="32" rx="1.5" fill="#ffffff" />
    <rect x="260" y="133" width="3" height="32" rx="1.5" fill="#ffffff" />

    <!-- Center Wing Substructure -->
    <rect x="221" y="174" width="58" height="48" fill="#35105c" />
    <!-- Center substructure vertical lines -->
    <rect x="226" y="180" width="3" height="28" fill="#ffffff" />
    <rect x="233" y="180" width="3" height="28" fill="#ffffff" />
    <rect x="244" y="180" width="3" height="28" fill="#ffffff" />
    <rect x="253" y="180" width="3" height="28" fill="#ffffff" />
    <rect x="264" y="180" width="3" height="28" fill="#ffffff" />
    <rect x="271" y="180" width="3" height="28" fill="#ffffff" />

    <!-- Left Wing -->
    <polygon points="145,198 145,178 152,178 152,168 221,168 221,222 145,222" fill="#35105c" />
    <!-- Left Wing Upper 3 Windows -->
    <rect x="180" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <rect x="193" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <rect x="206" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <!-- Left Wing Lower Windows Grid (Vertical Slats) -->
    <rect x="150" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="160" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="170" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="180" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="190" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="200" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="210" y="200" width="4" height="18" fill="#ffffff" />

    <!-- Right Wing -->
    <polygon points="355,198 355,178 348,178 348,168 279,168 279,222 355,222" fill="#35105c" />
    <!-- Right Wing Upper 3 Windows -->
    <rect x="290" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <rect x="303" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <rect x="316" y="173" width="4" height="15" rx="1" fill="#ffffff" />
    <!-- Right Wing Lower Windows Grid (Vertical Slats) -->
    <rect x="286" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="296" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="306" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="316" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="326" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="336" y="200" width="4" height="18" fill="#ffffff" />
    <rect x="346" y="200" width="4" height="18" fill="#ffffff" />

    <!-- Baseline and ground -->
    <line x1="140" y1="222" x2="360" y2="222" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Inner circle lower arc border separating building and banner -->
  <circle cx="250" cy="225" r="126" fill="none" stroke="#ffffff" stroke-width="3" />
  <circle cx="250" cy="225" r="135" fill="none" stroke="#ffffff" stroke-width="4" />

  <!-- Ribbon Banner Component -->
  <!-- Left Tail Background Fold -->
  <polygon points="76,346 104,306 142,311 138,348 108,342" fill="#240a3e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <polygon points="76,346 108,342 66,380 92,342" fill="#35105c" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Right Tail Background Fold -->
  <polygon points="424,346 396,306 358,311 362,348 392,342" fill="#240a3e" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
  <polygon points="424,346 392,342 434,380 408,342" fill="#35105c" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Main Front Ribbon Banner Body -->
  <path d="M 94,308 Q 250,358 406,308 L 400,344 Q 250,396 100,344 Z" fill="#35105c" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Ribbon Inner White Accent Arc -->
  <path d="M 104,314 Q 250,361 396,314" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  <path d="M 108,338 Q 250,388 392,338" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />

  <!-- Text Top: PGT MU'ALLIMIN -->
  <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="2.2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      PGT MU'ALLIMIN
    </textPath>
  </text>

  <!-- Text Bottom: MUHAMMADIYAH YOGYAKARTA -->
  <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="1.6">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      MUHAMMADIYAH YOGYAKARTA
    </textPath>
  </text>
</svg>
